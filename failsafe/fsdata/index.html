<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<title>MediaTek System Recovery Mode</title>
	<link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
	<div id="banner">
		MediaTek U-Boot System Recovery Mode
	</div>
	<div id="main">
		<p>Upload new firmware:</p>
		<form action="/upload" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Firmware" /></p>
		</form>

		<hr>

		<p>Upload bootloader:</p>
		<form action="/upload_bl" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Bootloader" /></p>
		</form>

		<hr>

		<p>Upload factory data:</p>
		<form action="/upload_factory" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Factory" /></p>
		</form>

		<hr>

		<p style="font-size: 12px; color: #666;">作者：黑猫  QQ群号：160318975</p>
	</div>
</body>
</html>
